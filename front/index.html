<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/public/icon.png">
    <title>{{site_title}}</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-fallback: #F5F4ED;
        --bg-image: url('/public/light.png');
        --bg: var(--bg-image) top center/100% auto repeat-y, var(--bg-fallback);
        --text: #262624;
        --primary: #C96442;
        --border: rgba(35, 35, 45, 0.12);
        --muted: rgba(38, 38, 36, 0.68);
        --surface: rgba(255, 255, 255, 0.7);
        --card-bg: rgba(255, 255, 255, 0.85);
        --card-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        --transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
        --font-stack: "Hiragino Maru Gothic ProN", "Meiryo", "SF Pro", "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg-fallback: #F5F4ED;
          --bg-image: url('/public/light.png');
          --bg: var(--bg-image) top center/100% auto repeat-y, var(--bg-fallback);
          --text: #262624;
          --primary: #C96442;
          --border: rgba(35, 35, 45, 0.12);
          --muted: rgba(38, 38, 36, 0.68);
          --surface: rgba(255, 255, 255, 0.7);
          --card-bg: rgba(255, 255, 255, 0.85);
          --card-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg-fallback: linear-gradient(135deg, #1e2d40 0%, #2d4059 45%, #3a506b 100%);
          --bg-image: url('/public/night.png');
          --bg: var(--bg-image) top center/100% auto repeat-y, var(--bg-fallback);
          --text: #e0e7f1;
          --primary: #a4c3b2;
          --border: rgba(255, 255, 255, 0.15);
          --muted: rgba(224, 231, 241, 0.72);
          --surface: rgba(30, 45, 64, 0.65);
          --card-bg: rgba(30, 45, 64, 0.72);
          --card-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-stack);
        background: var(--bg);
        color: var(--text);
        letter-spacing: 0.018em;
        line-height: 1.7;
        transition: var(--transition);
        animation: pageBackgroundSettle 1s ease-out both;
      }

      body.is-card-transitioning > *:not(.card-transition-clone) {
        opacity: 0;
        transition: opacity 0.24s ease;
      }

      main.container {
        max-width: 880px;
        margin: 0 auto 48px;
        padding: 0 24px 64px;
      }

      .card-list {
        display: grid;
        gap: 18px;
      }

      .card {
        opacity: 0;
        background: var(--card-bg);
        border-radius: 12px;
        padding: 20px 24px;
        border: 1px solid var(--border);
        box-shadow: var(--card-shadow);
        transition: var(--transition);
        backdrop-filter: blur(6px);
        animation: cardRiseIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .card:nth-child(2) {
        animation-delay: 0.06s;
      }

      .card:nth-child(3) {
        animation-delay: 0.12s;
      }

      .card:nth-child(4) {
        animation-delay: 0.18s;
      }

      .card:nth-child(n + 5) {
        animation-delay: 0.24s;
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
      }

      .card.is-transition-source {
        opacity: 0;
      }

      .card-transition-clone {
        position: fixed;
        z-index: 9999;
        overflow: hidden;
        pointer-events: none;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.24);
        backdrop-filter: blur(6px);
        transition:
          top 0.46s cubic-bezier(0.22, 1, 0.36, 1),
          left 0.46s cubic-bezier(0.22, 1, 0.36, 1),
          width 0.46s cubic-bezier(0.22, 1, 0.36, 1),
          height 0.46s cubic-bezier(0.22, 1, 0.36, 1),
          border-radius 0.46s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.22s ease;
      }

      .card-transition-clone .actions {
        opacity: 0;
      }

      .card.is-filtered {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
        pointer-events: none;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        flex-wrap: wrap;
      }

      .card-header h2 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
      }

      .card-header a {
        color: var(--text);
        text-decoration: none;
      }

      .card-header a:hover {
        color: var(--primary);
        text-decoration: underline;
      }

      .page-id {
        font-size: 12px;
        color: var(--muted);
        background: var(--surface);
        border-radius: 999px;
        padding: 4px 10px;
        border: 1px solid var(--border);
      }

      .description {
        margin: 12px 0 0;
        color: var(--muted);
      }

      .keywords {
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
      }

      .keyword-value {
        font-weight: 600;
        color: var(--text);
      }

      .actions {
        margin-top: 16px;
      }

      .read-more {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        transition: var(--transition);
      }

      .read-more:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(201, 100, 66, 0.25);
      }

      .empty {
        padding: 32px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px dashed var(--border);
        color: var(--muted);
        text-align: center;
      }

      .beian {
        margin: 0 0 32px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }

      .site-subtitle {
        max-width: 880px;
        margin: 0 auto 24px;
        padding: 0 24px;
        color: var(--muted);
        font-size: 1.05rem;
        font-weight: 700;
        font-style: italic;
        letter-spacing: 0.05em;
        animation: subtitleFadeIn 0.7s ease-out both;
        animation-delay: 0.12s;
      }

      @keyframes pageBackgroundSettle {
        from {
          background-position: center -24px, center;
        }

        to {
          background-position: center top, center;
        }
      }

      @keyframes cardRiseIn {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.98);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes subtitleFadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-width: 640px) {
        .card {
          padding: 18px 20px;
        }
      }
    </style>
  </head>
  <body>
    {{site_header}}
    <p class="site-subtitle">{{site_subtitle}}</p>
    <main class="container">
      <section class="card-list">{{page_list}}</section>
    </main>
    {{beian_number}}
    <script>
      const searchInput = document.getElementById('search-input');
      const cards = Array.from(document.querySelectorAll('.card-list .card'));
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const transitionKey = 'solin_article_transition';

      const normalize = (value) => (value || '').toLowerCase();

      const applySearch = () => {
        const query = normalize(searchInput.value.trim());
        cards.forEach((card) => {
          const haystack = normalize([
            card.dataset.title,
            card.dataset.description,
            card.dataset.keywords,
          ].join(' '));
          const isVisible = query === '' || haystack.includes(query);
          card.classList.toggle('is-filtered', !isVisible);
          if (isVisible) {
            card.style.display = '';
          } else {
            setTimeout(() => {
              if (card.classList.contains('is-filtered')) {
                card.style.display = 'none';
              }
            }, 220);
          }
        });
      };

      searchInput?.addEventListener('input', applySearch);

      const getTargetRect = () => ({
        top: 48,
        left: Math.max(24, (window.innerWidth - 880) / 2),
        width: Math.min(880, window.innerWidth - 48),
        height: Math.max(320, window.innerHeight - 112),
      });

      const storeTransition = (card, rect) => {
        try {
          sessionStorage.setItem(transitionKey, JSON.stringify({
            pageId: card.dataset.pageId || '',
            title: card.dataset.title || '',
            description: card.dataset.description || '',
            keywords: card.dataset.keywords || '',
            rect,
            createdAt: Date.now(),
          }));
        } catch (_err) {
          // Session storage may be unavailable in private or restricted contexts.
        }
      };

      const animateCardExit = (event) => {
        const link = event.target.closest('a[href]');
        const card = link?.closest('.card');
        if (!link || !card || reduceMotion || event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
          return;
        }

        const url = new URL(link.href, window.location.href);
        if (url.origin !== window.location.origin || !url.pathname.startsWith('/pages/')) {
          return;
        }

        event.preventDefault();
        const rect = card.getBoundingClientRect();
        storeTransition(card, {
          top: rect.top,
          left: rect.left,
          width: rect.width,
          height: rect.height,
        });

        const clone = card.cloneNode(true);
        clone.className = 'card-transition-clone';
        Object.assign(clone.style, {
          top: `${rect.top}px`,
          left: `${rect.left}px`,
          width: `${rect.width}px`,
          height: `${rect.height}px`,
        });

        document.body.appendChild(clone);
        document.body.classList.add('is-card-transitioning');
        card.classList.add('is-transition-source');

        requestAnimationFrame(() => {
          const target = getTargetRect();
          Object.assign(clone.style, {
            top: `${target.top}px`,
            left: `${target.left}px`,
            width: `${target.width}px`,
            height: `${target.height}px`,
            borderRadius: '14px',
          });
        });

        setTimeout(() => {
          window.location.href = link.href;
        }, 430);
      };

      document.querySelector('.card-list')?.addEventListener('click', animateCardExit);
    </script>
  </body>
</html>
