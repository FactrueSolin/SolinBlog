<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/public/icon.png">
    <title>Markdown</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg-fallback: #F5F4ED;
            --bg-image: url('/public/light.png');
            --bg: var(--bg-image) top center/100% auto repeat-y, var(--bg-fallback);
            --text: #262624;
            --primary: #C96442;
            --border: rgba(35, 35, 45, 0.12);
            --muted: rgba(38, 38, 36, 0.68);
            --surface: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            --inline-code: rgb(203, 64, 66);
            --inline-code-bg: rgba(203, 64, 66, 0.12);
            --code-bg: rgba(255, 255, 255, 0.6);
            --quote-bg: rgba(201, 100, 66, 0.08);
            --quote-border: rgba(201, 100, 66, 0.45);
            --table-stripe: rgba(35, 35, 45, 0.04);
        }

        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --bg-fallback: #F5F4ED;
                --bg-image: url('/public/light.png');
                --bg: var(--bg-image) top center/100% auto repeat-y, var(--bg-fallback);
                --text: #262624;
                --primary: #C96442;
                --border: rgba(35, 35, 45, 0.12);
                --muted: rgba(38, 38, 36, 0.68);
                --surface: rgba(255, 255, 255, 0.7);
                --card-bg: rgba(255, 255, 255, 0.85);
                --card-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
                --inline-code: rgb(203, 64, 66);
                --inline-code-bg: rgba(203, 64, 66, 0.12);
                --code-bg: rgba(255, 255, 255, 0.6);
                --quote-bg: rgba(201, 100, 66, 0.08);
                --quote-border: rgba(201, 100, 66, 0.45);
                --table-stripe: rgba(35, 35, 45, 0.04);
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg-fallback: linear-gradient(135deg, #1e2d40 0%, #2d4059 45%, #3a506b 100%);
                --bg-image: url('/public/night.png');
                --bg: var(--bg-image) top center/100% auto repeat-y, var(--bg-fallback);
                --text: #e0e7f1;
                --primary: #a4c3b2;
                --border: rgba(255, 255, 255, 0.15);
                --muted: rgba(224, 231, 241, 0.72);
                --surface: rgba(30, 45, 64, 0.65);
                --card-bg: rgba(30, 45, 64, 0.72);
                --card-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
                --inline-code: #a4c3b2;
                --inline-code-bg: rgba(58, 80, 107, 0.3);
                --code-bg: rgba(30, 45, 64, 0.7);
                --quote-bg: rgba(164, 195, 178, 0.14);
                --quote-border: rgba(164, 195, 178, 0.5);
                --table-stripe: rgba(255, 255, 255, 0.05);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Hiragino Maru Gothic ProN", "Meiryo", "SF Pro", "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            letter-spacing: 0.018em;
            animation: markdownPageIn 0.9s ease-out both;
        }

        body.is-article-transitioning > *:not(.article-transition-clone) {
            opacity: 0;
        }

        .markdown-body {
            width: min(880px, calc(100% - 48px));
            max-width: 880px;
            margin: 48px auto 64px;
            padding: 24px 28px 72px;
            line-height: 1.7;
            font-size: 16px;
            word-wrap: break-word;
            border-radius: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(6px);
            animation: articleRiseIn 0.72s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .markdown-body.is-transition-target {
            opacity: 0;
            animation: none;
        }

        .article-transition-clone {
            position: fixed;
            z-index: 9999;
            overflow: hidden;
            pointer-events: none;
            padding: 20px 24px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.24);
            backdrop-filter: blur(6px);
            line-height: 1.7;
            transition:
                top 0.48s cubic-bezier(0.22, 1, 0.36, 1),
                left 0.48s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.48s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.48s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.48s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.22s ease;
        }

        .article-transition-clone h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .article-transition-clone .description,
        .article-transition-clone .keywords {
            margin-top: 12px;
            color: var(--muted);
        }

        .markdown-body p {
            margin: 0 0 1.2em 0;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            margin: 1.6em 0 0.7em;
            font-weight: 700;
            line-height: 1.25;
            color: var(--text);
            scroll-margin-top: 24px;
        }

        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            animation: headingSlideIn 0.52s ease-out both;
        }

        .markdown-body h1 {
            font-size: 2.25rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.35em;
        }

        .markdown-body h2 {
            font-size: 1.7rem;
            padding-bottom: 0.3em;
            border-bottom: 1px solid var(--border);
        }

        .markdown-body h3 {
            font-size: 1.3rem;
        }

        .markdown-body h4 {
            font-size: 1.1rem;
        }

        .markdown-body h5 {
            font-size: 1rem;
        }

        .markdown-body h6 {
            font-size: 0.95rem;
            color: var(--muted);
        }

        .markdown-body code {
            padding: 0.2em 0.4em;
            margin: 0 0.1em;
            font-size: 0.95em;
            background: var(--inline-code-bg);
            color: var(--inline-code);
            border-radius: 6px;
            font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        .markdown-body pre {
            margin: 1.3em 0;
            padding: 18px 20px;
            overflow: auto;
            background: var(--code-bg);
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .markdown-body pre:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px rgba(15, 23, 42, 0.12);
        }

        .markdown-body pre code {
            padding: 0;
            margin: 0;
            background: transparent;
            border-radius: 0;
            font-size: 0.92em;
            line-height: 1.65;
            display: block;
            color: inherit;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
            background: var(--surface);
            border-radius: 10px;
            overflow: hidden;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid var(--border);
            padding: 10px 12px;
            text-align: left;
        }

        .markdown-body th {
            font-weight: 700;
        }

        .markdown-body tr:nth-child(even) {
            background: var(--table-stripe);
        }

        .markdown-body blockquote {
            margin: 1.4em 0;
            padding: 0.4em 1.2em;
            color: var(--muted);
            border-left: 4px solid var(--quote-border);
            background: var(--quote-bg);
            border-radius: 8px;
        }

        .markdown-body blockquote p {
            margin: 0.6em 0;
        }

        .markdown-body img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            margin: 1.2em auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .markdown-body img:hover {
            transform: scale(1.015);
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.14);
        }

        .markdown-body ul,
        .markdown-body ol {
            padding-left: 1.5em;
            margin: 0 0 1.1em 0;
        }

        .markdown-body li {
            margin: 0.4em 0;
        }

        .markdown-body li::marker {
            color: var(--primary);
        }

        .markdown-body .task-list-item {
            list-style: none;
        }

        .markdown-body .task-list-item input[type="checkbox"] {
            margin-right: 0.5em;
            transform: translateY(2px);
        }

        .markdown-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2.2em 0;
        }

        .markdown-body a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .markdown-body a:hover {
            color: color-mix(in srgb, var(--primary) 80%, #000 20%);
            text-decoration: underline;
        }

        .toc-container {
            position: fixed;
            top: 120px;
            left: calc(50% + 440px + 16px);
            width: 192px;
            max-height: calc(100vh - 160px);
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            backdrop-filter: blur(10px);
            overflow: auto;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
            z-index: 20;
            animation: tocSlideIn 0.58s ease-out 0.18s both;
        }

        .toc-title {
            margin: 0 0 8px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.04em;
        }

        .toc-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .toc-list li {
            margin: 6px 0;
            line-height: 1.4;
        }

        .toc-list a {
            color: var(--text);
            font-size: 0.9rem;
            display: inline-block;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .toc-list a:hover {
            color: var(--primary);
            transform: translateX(3px);
        }

        .toc-list .toc-level-2 {
            padding-left: 8px;
        }

        .toc-list .toc-level-3 {
            padding-left: 16px;
        }

        .toc-list .toc-level-4 {
            padding-left: 24px;
        }

        @keyframes markdownPageIn {
            from {
                background-position: center -24px, center;
            }

            to {
                background-position: center top, center;
            }
        }

        @keyframes articleRiseIn {
            from {
                opacity: 0;
                transform: translateY(22px) scale(0.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes headingSlideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes tocSlideIn {
            from {
                opacity: 0;
                transform: translateX(16px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 1180px) {
            .toc-container {
                display: none;
            }
        }
    </style>
</head>
<body>
    {{site_header}}
    <aside class="toc-container" id="toc" aria-label="目录">
        <div class="toc-title">目录</div>
        <ul class="toc-list" id="toc-list"></ul>
    </aside>
    <main class="markdown-body" data-page-id="{{page_id}}">
        {{markdown_html}}
    </main>
    <script>
        (function () {
            const toc = document.getElementById("toc");
            const tocList = document.getElementById("toc-list");
            const headings = document.querySelectorAll(".markdown-body h2, .markdown-body h3, .markdown-body h4");

            if (!toc || !tocList || headings.length === 0) {
                if (toc) {
                    toc.style.display = "none";
                }
                return;
            }

            const slugify = (text) => text
                .trim()
                .toLowerCase()
                .replace(/[^\w\u4e00-\u9fa5\s-]/g, "")
                .replace(/\s+/g, "-");

            const usedIds = new Map();

            headings.forEach((heading) => {
                if (!heading.id) {
                    const baseId = slugify(heading.textContent || "");
                    const count = usedIds.get(baseId) || 0;
                    usedIds.set(baseId, count + 1);
                    heading.id = count ? `${baseId}-${count}` : baseId || `section-${usedIds.size}`;
                }

                const level = Number(heading.tagName.replace("H", ""));
                const li = document.createElement("li");
                li.className = `toc-level-${level}`;

                const link = document.createElement("a");
                link.href = `#${heading.id}`;
                link.textContent = heading.textContent || "";

                li.appendChild(link);
                tocList.appendChild(li);
            });
        })();

        (function () {
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const body = document.body;
            const article = document.querySelector('.markdown-body');
            const transitionKey = 'solin_article_transition';

            if (!article || reduceMotion) {
                return;
            }

            let state = null;
            try {
                state = JSON.parse(sessionStorage.getItem(transitionKey) || 'null');
                sessionStorage.removeItem(transitionKey);
            } catch (_err) {
                state = null;
            }

            const expectedPageId = article.dataset.pageId || body.dataset.pageId || '';
            if (!state?.rect || state.pageId !== expectedPageId || Date.now() - Number(state.createdAt || 0) > 8000) {
                return;
            }

            const target = article.getBoundingClientRect();
            const clone = document.createElement('div');
            clone.className = 'article-transition-clone';
            const title = document.createElement('h2');
            title.textContent = state.title || '';
            const description = document.createElement('p');
            description.className = 'description';
            description.textContent = state.description || '';
            const keywords = document.createElement('div');
            keywords.className = 'keywords';
            const keywordsLabel = document.createElement('span');
            keywordsLabel.textContent = '关键词：';
            const keywordsValue = document.createElement('span');
            keywordsValue.textContent = state.keywords || '无';
            keywords.append(keywordsLabel, keywordsValue);
            clone.append(title, description, keywords);
            Object.assign(clone.style, {
                top: `${state.rect.top}px`,
                left: `${state.rect.left}px`,
                width: `${state.rect.width}px`,
                height: `${state.rect.height}px`,
            });

            article.classList.add('is-transition-target');
            body.classList.add('is-article-transitioning');
            body.appendChild(clone);

            requestAnimationFrame(() => {
                Object.assign(clone.style, {
                    top: `${target.top}px`,
                    left: `${target.left}px`,
                    width: `${target.width}px`,
                    height: `${Math.min(Math.max(target.height, 320), window.innerHeight - 96)}px`,
                    borderRadius: '14px',
                });
            });

            setTimeout(() => {
                article.classList.remove('is-transition-target');
                body.classList.remove('is-article-transitioning');
                clone.style.opacity = '0';
            }, 500);

            setTimeout(() => clone.remove(), 720);
        })();
    </script>
</body>
</html>
